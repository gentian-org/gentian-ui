name: concierge

# The concierge: builds the concierge-web image and the concierge chart from
# apps/concierge/, the way the consoles' are built. gentian-os installs it as
# a component of the platform tenant and publishes it on the cluster's bare
# domain from that tenant's DMZ.

# A branch is checked as a pull request, and what is merged is checked and
# published as a push. Not both: a branch that ran on its push and again on its
# pull request did the same work twice. A branch without a pull request is not
# checked; open one, as a draft if need be, or start the workflow by hand.
on:
  push:
    branches:
      - develop
    paths:
      - "apps/concierge/**"
      - ".github/workflows/concierge.yaml"
  # Every pull request, whatever it touches: the `gate` job below is a status
  # the branch rules require, and a check that is never started never reports,
  # so a path filter here would block the merge of anything outside this app.
  # The `changes` job applies the filter instead and skips the build.
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  WEB_IMAGE: ghcr.io/gentian-org/concierge-web

jobs:
  # Whether this run has anything of this app's to build. A push or a manual
  # run always has: the push trigger is path-filtered. A pull request is
  # compared with its base, and when nothing under apps/concierge or this file
  # changed, `test` is skipped and everything after it with it. When the
  # comparison cannot be answered — too large to list, API error — the build
  # runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "${EVENT}" = "pull_request" ] \
            && gh api "repos/${GITHUB_REPOSITORY}/compare/${PR_BASE}...${PR_HEAD}" \
                 --jq '.files[].filename' > /tmp/changed \
            && [ "$(wc -l < /tmp/changed)" -gt 0 ] \
            && [ "$(wc -l < /tmp/changed)" -lt 300 ]; then
            if ! grep -qE '^(apps/concierge/|\.github/workflows/concierge\.yaml$)' /tmp/changed; then
              run=false
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "${run}" = "false" ]; then
            echo "Nothing under apps/concierge changed; the build is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Routing tests
        working-directory: apps/concierge
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # The same three tags as the consoles' images, for the same reasons:
      # develop moves, <sha> and develop-<sha> do not, and only the last is
      # both immutable and branch-scoped, which is what a pin should name.
      - name: Set image tag
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "immutable=${branch}-${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: apps/concierge
          file: apps/concierge/Dockerfile
          push: >-
            ${{ github.event_name != 'pull_request'
            && github.ref == 'refs/heads/develop' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.short }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.immutable }}

      # The published images, signed with this workflow's identity and scanned
      # (certification plan C5). Only where the build pushed: a pull request's
      # image exists nowhere to be signed. The scans are advisory until the
      # backlog they find is triaged; dropping continue-on-error makes them block.
      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "${WEB_IMAGE}@${WEB_DIGEST}"
      - name: Scan the web image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  chart:
    # A component is installed from a chart the operator resolves through
    # provider-helm, which pulls from a registry. Published like the
    # consoles': a moving prerelease per branch and an immutable one per
    # commit, the moving one naming the immutable one in appVersion.
    runs-on: ubuntu-latest
    # After the image: the chart names the image of the build it came from.
    needs: [test, build]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Chart version
        id: chart
        run: |
          base="$(sed -n 's/^version: *//p' apps/concierge/chart/Chart.yaml)"
          short="${GITHUB_SHA::7}"
          # The chart's version is semver, and a prerelease part of digits
          # alone is a number there: "0710412" is refused for its leading
          # zero. A commit whose first seven characters are all digits is
          # named by as many more as it takes to reach a letter. The image
          # tag stays at seven.
          vshort="${short}"; n=7
          while [[ "${vshort}" =~ ^[0-9]+$ && "${n}" -lt 40 ]]; do n=$((n + 1)); vshort="${GITHUB_SHA::n}"; done
          branch="${GITHUB_REF_NAME//\//-}"
          echo "moving=${base}-${branch}" >> "$GITHUB_OUTPUT"
          echo "immutable=${base}-${branch}.${vshort}" >> "$GITHUB_OUTPUT"
          echo "image=${branch}-${short}" >> "$GITHUB_OUTPUT"
      - name: Name this build's image
        run: |
          sed -i 's/^\(\s*tag:\) "0\.1\.0"$/\1 "${{ steps.chart.outputs.image }}"/' apps/concierge/chart/values.yaml
          test "$(grep -c 'tag: "${{ steps.chart.outputs.image }}"' apps/concierge/chart/values.yaml)" = 1
      - name: Lint and package
        run: |
          helm lint apps/concierge/chart
          helm package apps/concierge/chart --version "${{ steps.chart.outputs.immutable }}" --app-version "${{ steps.chart.outputs.immutable }}" -d /tmp/chart-immutable
          helm package apps/concierge/chart --version "${{ steps.chart.outputs.moving }}" --app-version "${{ steps.chart.outputs.immutable }}" -d /tmp/chart-moving
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          helm push /tmp/chart-immutable/*.tgz oci://ghcr.io/gentian-org/charts
          helm push /tmp/chart-moving/*.tgz oci://ghcr.io/gentian-org/charts

  # The one status the branch rules require. It passes when every job above
  # succeeded or was skipped because this pull request gave it nothing to do,
  # and fails when any of them failed or was cancelled. `changes` itself must
  # have run: a decision that was skipped is not a decision.
  gate:
    name: concierge gate
    runs-on: ubuntu-latest
    needs: [changes, test, build, chart]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s' "${RESULTS}" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "a job this gate needs failed" >&2
            exit 1
          fi
          test "$(printf '%s' "${RESULTS}" | jq -r '.changes.result')" = "success"
