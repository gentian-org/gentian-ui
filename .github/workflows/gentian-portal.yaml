name: gentian-portal

# Builds gentian-portal-api and gentian-portal-web images. Cluster rollout is
# automatic via Argo CD Image Updater on the gentian-portal Application
# (see gentian-deployments/clusters/<cluster>/kernel/gentian-portal-*.yaml).

# Feature branches are tested but never published. The publish job is what
# rolls a cluster over, via Argo CD Image Updater, so a branch that built an
# image would deploy itself — which is the opposite of what a branch is for.
on:
  push:
    branches:
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths:
      - "frontend/**"
      - "backend/**"
      - "chart/**"
      - ".github/workflows/gentian-portal.yaml"
  pull_request:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "backend/**"
      - "chart/**"
      - ".github/workflows/gentian-portal.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/gentian-org/gentian-portal-web
  API_IMAGE: ghcr.io/gentian-org/gentian-portal-api

jobs:
  # The backend suite and the frontend typecheck, neither of which ran anywhere
  # before this job existed: the workflow built images and asserted nothing
  # about them, so the first thing to notice a broken build was a cluster.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm run build` is `tsc && vite build`, so this is the typecheck and the
      # production build in one. A type error and a bundle that cannot be
      # produced are the same class of problem here: an image that starts and
      # serves nothing.
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  build:
    runs-on: ubuntu-latest
    needs: [test]
    # develop only. A pull request has nowhere to deploy to, and a feature
    # branch that published would be picked up by Image Updater and rolled out.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Node base image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            docker pull node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd

      - name: Set image tag
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.short }}
          # No build-args. Vite freezes import.meta.env.VITE_* into the bundle
          # at build time, and this one image is deployed to every cluster — so
          # anything passed here is wrong everywhere except the cluster it names.
          # It named the test cluster (id.desk.gentian.org), which meant every
          # other deployment ran a portal that believed it lived there and
          # redirected tenant sessions to it. Deployment config now arrives from
          # the environment at container start; see frontend/docker-entrypoint.sh.

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.short }}
