name: desktop

# The desktop: builds gentian-portal-api and gentian-portal-web images and the
# gentian-portal chart, from apps/desktop/. The administration console beside it
# has its own workflow of the same shape (admin-console.yaml).
#
# Builds gentian-portal-api and gentian-portal-web images. Cluster rollout is
# automatic via Argo CD Image Updater on the gentian-portal Application
# (see gentian-deployments/clusters/<cluster>/kernel/gentian-portal-*.yaml).

# Feature branches are tested but never published. The publish job is what
# rolls a cluster over, via Argo CD Image Updater, so a branch that built an
# image would deploy itself — which is the opposite of what a branch is for.
#
# Release tags (v*) publish too, as gentian-portal-*:<tag>. A production
# cluster pins a release rather than following a branch, and until tags built
# images there was no release image to pin: prod ran develop-<sha> images and a
# tag named only the source. The paths filter below does not apply to tag
# pushes, so every release gets its images.
# A branch is checked as a pull request, and what is merged is checked and
# published as a push. Not both: a branch that ran on its push and again on its
# pull request did the same work twice. A branch without a pull request is not
# checked; open one, as a draft if need be, or start the workflow by hand.
on:
  push:
    branches:
      - develop
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yaml"
  # Every pull request, whatever it touches: the `gate` job below is a status
  # the branch rules require, and a check that is never started never reports,
  # so a path filter here would block the merge of anything outside this app.
  # The `changes` job applies the filter instead and skips the build.
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/gentian-org/gentian-portal-web
  API_IMAGE: ghcr.io/gentian-org/gentian-portal-api

jobs:
  # Whether this run has anything of this app's to build. A push or a manual
  # run always has: the push trigger is path-filtered. A pull request is
  # compared with its base, and when nothing under apps/desktop or this file
  # changed, `test` is skipped and everything after it with it. When the
  # comparison cannot be answered — too large to list, API error — the build
  # runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "${EVENT}" = "pull_request" ] \
            && gh api "repos/${GITHUB_REPOSITORY}/compare/${PR_BASE}...${PR_HEAD}" \
                 --jq '.files[].filename' > /tmp/changed \
            && [ "$(wc -l < /tmp/changed)" -gt 0 ] \
            && [ "$(wc -l < /tmp/changed)" -lt 300 ]; then
            if ! grep -qE '^(apps/desktop/|\.github/workflows/desktop\.yaml$)' /tmp/changed; then
              run=false
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "${run}" = "false" ]; then
            echo "Nothing under apps/desktop changed; the build is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The backend suite and the frontend typecheck, neither of which ran anywhere
  # before this job existed: the workflow built images and asserted nothing
  # about them, so the first thing to notice a broken build was a cluster.
  test:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.3"

      - name: Backend tests
        working-directory: apps/desktop/backend
        run: |
          # --locked: the lockfile must match pyproject.toml, as it must in
          # the image, so the tests run against what ships.
          uv sync --locked --extra dev
          uv run python -m pytest -q

      # Known vulnerabilities in what the lockfile installs. Advisory until
      # the backlog is triaged (certification plan C2); dropping
      # continue-on-error makes it block.
      - name: Backend dependency audit
        working-directory: apps/desktop/backend
        continue-on-error: true
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      # `npm run build` is `tsc && vite build`, so this is the typecheck and the
      # production build in one. A type error and a bundle that cannot be
      # produced are the same class of problem here: an image that starts and
      # serves nothing.
      - name: Frontend typecheck and build
        working-directory: apps/desktop/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Known vulnerabilities in the production dependencies. Advisory until
      # the backlog is triaged (certification plan C2).
      - name: Frontend dependency audit
        working-directory: apps/desktop/frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [test]
    # The job runs everywhere; only the push is gated, per build step below.
    # Gating the JOB meant a pull request never built an image at all, so the
    # one place a broken Dockerfile could still be caught cheaply proved
    # nothing and reported success — and a build that is only ever exercised
    # by the run that also publishes it has no dry run anywhere.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The arm64 leg is emulated, and buildx does not provide the emulator —
      # it needs qemu-user-static registered with binfmt_misc on the host. The
      # runner image currently ships that, so the build works without this step
      # and would keep working until the day it does not, failing as an
      # "exec format error" deep inside a RUN line that says nothing about the
      # runner. Declared here rather than inherited, for the reason the lint
      # job installs PyYAML instead of relying on the image having it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Pull Node base image
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            docker pull node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd

      # Three tags, and only one of them is safe to track.
      #
      #   develop           moving; the chart default and what a human pulls
      #   <sha>             immutable, but published from whatever branch built
      #                     it, so it says nothing about where the code came from
      #   develop-<sha>     immutable AND branch-scoped
      #
      # Argo CD Image Updater must follow the third. It cannot follow the first:
      # a candidate set of one name that never changes makes newest-build
      # re-select the same entry every cycle, so the tag it writes back never
      # moves and no build reaches the cluster. It must not follow the second:
      # every branch publishes into that namespace, so a main build would be a
      # valid candidate for a develop cluster.
      - name: Set image tag
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "immutable=${branch}-${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: apps/desktop/frontend
          file: apps/desktop/frontend/Dockerfile
          # develop publishes, because that is what Argo CD Image Updater
          # follows on a dev cluster; a v* tag publishes the release a prod
          # cluster pins. Every other ref builds the image — which is the
          # check — and pushes nothing.
          push: >-
            ${{ github.event_name != 'pull_request'
            && (github.ref == 'refs/heads/develop'
                || startsWith(github.ref, 'refs/tags/v')) }}
          # Without this the default builder produces an amd64-only image and
          # says nothing about it. The failure lands much later, as an
          # ImagePullBackOff on an arm64 node whose message never mentions
          # architecture. The frontend Dockerfile pins its build stage to
          # BUILDPLATFORM, so the arm64 leg here is only the runtime stage.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.short }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.immutable }}
          # No build-args. Vite freezes import.meta.env.VITE_* into the bundle
          # at build time, and this one image is deployed to every cluster — so
          # anything passed here is wrong everywhere except the cluster it names.
          # It named the test cluster (id.desk.gentian.org), which meant every
          # other deployment ran a portal that believed it lived there and
          # redirected tenant sessions to it. Deployment config now arrives from
          # the environment at container start; see frontend/docker-entrypoint.sh.

      - name: Build and push api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: apps/desktop/backend
          file: apps/desktop/backend/Dockerfile
          # develop publishes, because that is what Argo CD Image Updater
          # follows on a dev cluster; a v* tag publishes the release a prod
          # cluster pins. Every other ref builds the image — which is the
          # check — and pushes nothing.
          push: >-
            ${{ github.event_name != 'pull_request'
            && (github.ref == 'refs/heads/develop'
                || startsWith(github.ref, 'refs/tags/v')) }}
          # The backend has no build/runtime split to exploit: uv resolves and
          # installs into the target image, so the arm64 leg runs emulated. That
          # is acceptable while the dependencies ship arm64 wheels — a package
          # without one compiles from source under QEMU and this step gets slow.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.short }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.immutable }}
      # The published images, signed with this workflow's identity and scanned
      # (certification plan C5). Only where the build pushed: a pull request's
      # image exists nowhere to be signed. The scans are advisory until the
      # backlog they find is triaged; dropping continue-on-error makes them block.
      - name: Install cosign
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # --new-bundle-format=false: cosign 3 stores a signature as a Sigstore bundle
      # behind the OCI referrers API by default; the cluster's Kyverno 1.13 verifies
      # the legacy form, a sha256-<digest>.sig tag, with its default verifier. The
      # bundle form returns with the Kyverno upgrade (certification plan C5).
      - name: Sign the images
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false "${WEB_IMAGE}@${WEB_DIGEST}"
          cosign sign --yes --new-bundle-format=false "${API_IMAGE}@${API_DIGEST}"
      - name: Scan the web image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan the api image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}@${{ steps.api.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  chart:
    # The desktop is a component: the platform installs it per tenant from
    # a chart the operator resolves through provider-helm, which pulls from a
    # registry and not from git. So the chart is published as an OCI
    # artefact, versioned like the images -- a moving prerelease per branch
    # the profile can follow on a dev cluster, and an immutable one per
    # commit for anything that pins.
    runs-on: ubuntu-latest
    # After the images: the chart names the images of the build it came
    # from, so it must not exist before they do.
    needs: [test, build]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Chart version
        id: chart
        run: |
          base="$(sed -n 's/^version: *//p' apps/desktop/chart/Chart.yaml)"
          short="${GITHUB_SHA::7}"
          # The chart's version is semver, and a prerelease part of digits
          # alone is a number there: "0710412" is refused for its leading
          # zero. A commit whose first seven characters are all digits is
          # named by as many more as it takes to reach a letter. The image
          # tag stays at seven.
          vshort="${short}"; n=7
          while [[ "${vshort}" =~ ^[0-9]+$ && "${n}" -lt 40 ]]; do n=$((n + 1)); vshort="${GITHUB_SHA::n}"; done
          branch="${GITHUB_REF_NAME//\//-}"
          echo "moving=${base}-${branch}" >> "$GITHUB_OUTPUT"
          echo "immutable=${base}-${branch}.${vshort}" >> "$GITHUB_OUTPUT"
          echo "image=${branch}-${short}" >> "$GITHUB_OUTPUT"
      # The chart's default image tag is the immutable, branch-scoped tag of
      # this very build. A chart that says "0.1.0" names an image nobody
      # publishes; a chart installed as a component has no image updater to
      # fill the tag in later, so the chart itself has to be right.
      - name: Name this build's images
        run: |
          sed -i 's/^\(\s*tag:\) "0\.1\.0"$/\1 "${{ steps.chart.outputs.image }}"/' apps/desktop/chart/values.yaml
          test "$(grep -c 'tag: "${{ steps.chart.outputs.image }}"' apps/desktop/chart/values.yaml)" = 2
      - name: Lint and package
        run: |
          helm lint apps/desktop/chart
          helm package apps/desktop/chart --version "${{ steps.chart.outputs.immutable }}" --app-version "${{ steps.chart.outputs.immutable }}" -d /tmp/chart-immutable
          # The moving chart's appVersion is the immutable version it is a
          # copy of: a cluster that follows the branch reads the pin off the
          # moving chart and installs the immutable one, since a Helm
          # release under an unchanged version string is never upgraded.
          helm package apps/desktop/chart --version "${{ steps.chart.outputs.moving }}" --app-version "${{ steps.chart.outputs.immutable }}" -d /tmp/chart-moving
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          helm push /tmp/chart-immutable/*.tgz oci://ghcr.io/gentian-org/charts
          helm push /tmp/chart-moving/*.tgz oci://ghcr.io/gentian-org/charts

  # The one status the branch rules require. It passes when every job above
  # succeeded or was skipped because this pull request gave it nothing to do,
  # and fails when any of them failed or was cancelled. `changes` itself must
  # have run: a decision that was skipped is not a decision.
  gate:
    name: desktop gate
    runs-on: ubuntu-latest
    needs: [changes, test, build, chart]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s' "${RESULTS}" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "a job this gate needs failed" >&2
            exit 1
          fi
          test "$(printf '%s' "${RESULTS}" | jq -r '.changes.result')" = "success"
