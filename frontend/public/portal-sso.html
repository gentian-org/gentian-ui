<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing in...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f5f7f6;
        color: #1a2e28;
      }
    </style>
  </head>
  <body>
    <p>Signing in...</p>
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const ticket = params.get("t");
        if (!ticket) {
          window.location.replace("/");
          return;
        }

        // Optional target parameters/intent from the tile launch
        const open = params.get("open");
        const app = params.get("app");
        let target = `/portal-bridge.php?t=${encodeURIComponent(ticket)}`;
        if (open) {
          target += `&open=${encodeURIComponent(open)}`;
        }
        if (app) {
          target += `&app=${encodeURIComponent(app)}`;
        }

        // Redirect to the portal bridge handler same-origin
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
