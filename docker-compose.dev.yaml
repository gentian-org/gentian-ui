services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shell
      POSTGRES_PASSWORD: shell
      POSTGRES_DB: gentian_shell
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shell"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shell:shell@db:5432/gentian_shell
      AUTH_DISABLED: "true"
      KERNEL_DOMAIN: localhost
      BACKEND_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_AUTH_DISABLED: "true"
    depends_on:
      - api

volumes:
  web_node_modules:
