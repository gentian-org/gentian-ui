apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentian-portal.fullname" . }}-web
  labels:
    {{- include "gentian-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-web
  template:
    metadata:
      labels:
        {{- include "gentian-portal.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        {{- include "gentian-portal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy | default "IfNotPresent" }}
          # Runtime configuration. docker-entrypoint.sh renders these into
          # /config.js at container start, and index.html loads it before the
          # app bundle.
          #
          # These belong in the environment, not in build args: Vite freezes
          # import.meta.env.VITE_* at build time and one image serves every
          # cluster, so a baked-in issuer can only be correct for the cluster
          # that built it. The SPA derives the kernel domain from the issuer and
          # sends sessions to <tenant>.<kernel-domain>, so a wrong issuer sends
          # them to another deployment entirely.
          env:
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            # Built here rather than configured separately so it cannot drift
            # from kernelDomain; matches how the API derives idp_public_base_url.
            - name: OIDC_ISSUER
              value: {{ printf "https://id.%s/auth/realms/%s" .Values.kernelDomain (.Values.kernelRealm | default "kernel") | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.clientId | default "gentian-portal" | quote }}
            # Only scopes the kernel realm defines. Requesting an undefined
            # scope makes Keycloak reject the authorization request with
            # invalid_scope and loops the user back to /login.
            - name: OIDC_SCOPES
              value: {{ .Values.auth.scopes | default "openid profile email" | quote }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            {{- range $key, $value := .Values.web.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          securityContext:
            {{- include "gentian-portal.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.web.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # The served document root. The entrypoint copies the built assets
            # here from /app/dist and generates config.js alongside them, which
            # it cannot do in the image layer because readOnlyRootFilesystem is
            # set. The container refuses to start without this mount rather than
            # serving a portal with no runtime configuration.
            - name: www
              mountPath: /app/www
      volumes:
        - name: www
          emptyDir: {}
