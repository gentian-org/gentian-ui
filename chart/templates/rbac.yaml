{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gentian-portal.fullname" . }}
rules:
  - apiGroups: ["gentianos.io"]
    resources: ["appprofiles", "appcatalogues", "tenants"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["gentianos.io"]
    resources: ["platformsecuritypolicies"]
    verbs: ["get", "list", "watch", "update", "patch", "replace"]
  - apiGroups: ["gentianos.io"]
    resources: ["integrationbindings", "appgrants"]
    verbs: ["get", "list", "watch", "update", "patch", "replace"]
  # Read-only: the customization debt report (Admin Console -> Customization tab)
  # displays live Customization records; it never authors them.
  - apiGroups: ["gentianos.io"]
    resources: ["customizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gentian-portal.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gentian-portal.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-portal.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
