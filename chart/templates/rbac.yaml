{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gentian-portal.fullname" . }}
rules:
  - apiGroups: ["gentianos.io"]
    resources: ["appprofiles", "appcatalogues", "tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gentian-portal.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gentian-portal.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-portal.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
