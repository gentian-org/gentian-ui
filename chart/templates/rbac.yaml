{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gentian-portal.fullname" . }}
rules:
  - apiGroups: ["gentianos.io"]
    resources: ["appprofiles", "appcatalogues", "apppackages", "tenants"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["gentianos.io"]
    resources: ["platformsecuritypolicies"]
    verbs: ["get", "list", "watch", "update", "patch", "replace"]
  - apiGroups: ["gentianos.io"]
    resources: ["integrationbindings", "appgrants"]
    verbs: ["get", "list", "watch", "update", "patch", "replace"]
  # Read-only: the customization debt report (Admin Console -> Customization tab)
  # displays live Customization records; it never authors them.
  - apiGroups: ["gentianos.io"]
    resources: ["customizations"]
    verbs: ["get", "list", "watch"]
  # The Backup tab creates TenantExports and reads their progress. Delete is
  # included so an admin can clear a finished export; update is not, because
  # an export's spec is a record of what was captured and editing it after the
  # fact would make its own status a lie.
  - apiGroups: ["gentianos.io"]
    resources: ["tenantexports"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Backup settings. Update and delete are both needed: a policy is edited in
  # place, and deleting a tenant's returns it to inheriting the cluster's.
  #
  # These verbs are the console's, not any admin's. Every call reaches the API
  # server as this service account — nothing here impersonates the signed-in
  # user — so RBAC authorises the console and cannot tell a tenant admin from a
  # platform one. That is true of every resource this role grants, and it is
  # why the tenant boundary is enforced in the API layer: routes gate on
  # isPlatformAdmin and reads filter on spec.tenant.
  - apiGroups: ["gentianos.io"]
    resources: ["backuppolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The schedule overview lists across namespaces so a platform admin can see
  # which tenants are actually backed up. No create: a schedule comes from the
  # backup settings, and the operator owns the one it derives.
  - apiGroups: ["gentianos.io"]
    resources: ["tenantexportschedules"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # create/delete on Secrets exists for one purpose: a backup passphrase is
  # written as a Secret in the tenant's namespace so it never appears in a
  # TenantExport spec, in etcd as plain spec data, or in `kubectl get -o yaml`.
  # The operator copies it beside the capture Jobs and deletes both copies when
  # the export finishes.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gentian-portal.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gentian-portal.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-portal.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
