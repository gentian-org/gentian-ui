apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentian-portal.fullname" . }}-api
  labels:
    {{- include "gentian-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-api
  template:
    metadata:
      labels:
        {{- include "gentian-portal.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "gentian-portal.fullname" . }}
      securityContext:
        {{- include "gentian-portal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            {{- include "gentian-portal.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.api.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            - name: KERNEL_REALM
              value: {{ .Values.kernelRealm | default "kernel" | quote }}
            # Capabilities this cluster actually serves. A platform app annotated
            # gentianos.io/requires-capability gets a desktop tile only when its
            # capability is listed here, so an undeployed component cannot offer
            # a tile pointing at a host that resolves to nothing.
            - name: GENTIAN_CAPABILITIES
              value: {{ .Values.capabilities | default (ternary "llm" "" .Values.llm.enabled) | quote }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.credentialManager.url }}
            - name: CREDENTIAL_MANAGER_URL
              value: {{ .Values.credentialManager.url | quote }}
            {{- end }}
            {{- if .Values.appLifecycle.url }}
            - name: APP_LIFECYCLE_URL
              value: {{ .Values.appLifecycle.url | quote }}
            {{- end }}
            {{- if .Values.openfga.apiUrl }}
            - name: OPENFGA_API_URL
              value: {{ .Values.openfga.apiUrl | quote }}
            {{- end }}
            {{- if .Values.openfga.storeId }}
            - name: OPENFGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            {{- end }}
            {{- if .Values.openfga.authzenEnabled }}
            - name: OPENFGA_AUTHZEN_ENABLED
              value: "true"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name }}
            - secretRef:
                name: llm-credentials-open-webui
                optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
