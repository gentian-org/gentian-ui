kernelDomain: gentian.local
kernelRealm: kernel

api:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-api
    tag: "0.1.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext: {}
  env:
    ENVIRONMENT: local
    BACKEND_CORS_ORIGINS: http://localhost:5173

web:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-web
    tag: "0.1.0"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext: {}
  env:
    # (empty)
    #
    # VITE_* has no effect at runtime: Vite substitutes import.meta.env.VITE_*
    # during `npm run build`, so setting it on the Deployment does nothing. The
    # web container is configured by OIDC_ISSUER / OIDC_CLIENT_ID / OIDC_SCOPES /
    # AUTH_DISABLED / KERNEL_DOMAIN, which the entrypoint renders into
    # /config.js at start. Use this map only for genuinely extra env.

gateway:
  enabled: true
  parentGatewayName: kernel-public-gateway
  parentGatewayNamespace: platform-kernel
  host: portal
  # Gateway listener this route binds to. The kernel Gateway serves all HTTPS
  # names from one hostname-less listener; binding explicitly keeps the route
  # off the :80 redirect listener, which would otherwise serve the portal in
  # plaintext.
  listenerName: https-wildcard

existingSecret:
  name: gentian-portal-secrets

auth:
  disabled: false
  # OIDC public-client settings handed to the browser at RUNTIME (the web
  # container renders them into /config.js at start). Never build args: Vite
  # freezes import.meta.env.VITE_* into the bundle, and one image is deployed to
  # every cluster, so a baked-in value is wrong everywhere but one.
  clientId: gentian-portal
  # Must name only scopes the kernel realm actually defines. "groups" is NOT
  # one of them — the realm has no such client scope — and requesting it makes
  # Keycloak reject the whole authorization request:
  #   error=invalid_scope&error_description=Invalid scopes: openid profile email groups
  # which bounces the user back to /login in a loop that never reaches a
  # password prompt. Add the scope to the realm before adding it here.
  scopes: openid profile email

openfga:
  apiUrl: ""
  storeId: ""
  authzenEnabled: true

rbac:
  create: true

networkPolicy:
  create: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
