kernelDomain: gentian.local
kernelRealm: kernel

api:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-api
    tag: "0.1.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext: {}
  env:
    ENVIRONMENT: local
    BACKEND_CORS_ORIGINS: http://localhost:5173

web:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-web
    tag: "0.1.0"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext: {}
  env:
    VITE_AUTH_DISABLED: "false"

gateway:
  enabled: true
  parentGatewayName: kernel-public-gateway
  parentGatewayNamespace: platform-kernel
  host: portal

existingSecret:
  name: gentian-portal-secrets

databaseSecret:
  name: gentian-portal-db

auth:
  disabled: false

openfga:
  apiUrl: ""
  storeId: ""

rbac:
  create: true

networkPolicy:
  create: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
