[project]
name = "gentian-app-runtime"
version = "0.1.0"
description = "What the platform's apps share: token verification, tenant scoping, the origin check, security headers, drop-ins and extensions"
requires-python = ">=3.12,<4.0"
license = "MPL-2.0 AND Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gentian_app_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
