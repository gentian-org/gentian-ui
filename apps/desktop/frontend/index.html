<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#262696" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>Gentian</title>
    <!--
      Runtime configuration, written by docker-entrypoint.sh at container start
      from the environment. A classic (non-module) script so it executes before
      the module bundle below, guaranteeing window.__GENTIAN_CONFIG__ exists
      before any application code reads it.

      Deliberately not a build-time constant: one image is deployed to every
      cluster, so a value frozen at build time can only be correct for one of
      them. In dev, `vite dev` serves no config.js and the 404 is harmless —
      oidc.ts falls back to import.meta.env from .env.local.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
