apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentian-portal.fullname" . }}-api
  labels:
    {{- include "gentian-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-api
  template:
    metadata:
      labels:
        {{- include "gentian-portal.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "gentian-portal.name" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "gentian-portal.fullname" . }}
      securityContext:
        {{- include "gentian-portal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            {{- include "gentian-portal.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.api.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            - name: KERNEL_REALM
              value: {{ .Values.kernelRealm | default "kernel" | quote }}
            # The tenant's own language (AD-15). What a person sees before
            # they have chosen one and before a settings template has chosen
            # for them: a German tenant's people get a German desktop on their
            # first sign-in rather than whatever their browser asks for.
            #
            # The operator sets it from the tenant's first declared language,
            # so it follows the tenant rather than the image.
            - name: GENTIAN_DEFAULT_LANGUAGE
              value: {{ .Values.defaultLanguage | default "en" | quote }}
            # Capabilities this cluster actually serves. A platform app annotated
            # gentianos.io/requires-capability gets a desktop tile only when its
            # capability is listed here, so an undeployed component cannot offer
            # a tile pointing at a host that resolves to nothing.
            - name: GENTIAN_CAPABILITIES
              value: {{ .Values.capabilities | default (ternary "llm" "" .Values.llm.enabled) | quote }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | default "pkce" | quote }}
            {{- if .Values.auth.clientId }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.clientId | quote }}
            {{- end }}
            {{- /* Behind the edge the forwarded token is verified against the
                 zone's issuer, which the platform supplies; without one the
                 BFF verifies nothing. */}}
            {{- if and .Values.auth.issuer (not (hasKey (default dict .Values.api.env) "OIDC_ISSUER")) }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            {{- end }}
            {{- if .Values.tenant }}
            - name: GENTIAN_TENANT
              value: {{ .Values.tenant | quote }}
            {{- end }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- /* api.env wins when it names the same variable. Rendering both
                 halves produced a duplicate env name — harmless under
                 client-side apply (last one won), fatal under server-side
                 apply, which rejects the Deployment outright: the api never
                 deployed, /api had no backend, and login failed with an
                 empty 500. */}}
            {{- if and .Values.director.url (not (hasKey (default dict .Values.api.env) "DIRECTOR_URL")) }}
            - name: DIRECTOR_URL
              value: {{ .Values.director.url | quote }}
            {{- end }}
            {{- if and .Values.usher.url (not (hasKey (default dict .Values.api.env) "USHER_URL")) }}
            - name: USHER_URL
              value: {{ .Values.usher.url | quote }}
            {{- end }}
            {{- /* The assistant on the desktop (docs/ai-widget.md). Told only
                   when the platform delivered all three: that there is a
                   gateway for this desktop, where it is, and which Secret
                   holds this desktop's key. Otherwise nothing is set and the
                   assistant answers that it is not available. */}}
            {{- if include "gentian-portal.llmDelivered" . }}
            - name: LLM_AVAILABLE
              value: "true"
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_API_KEY_FILE
              value: /var/run/gentian/llm/api-key
            {{- end }}
            {{- if .Values.openfga.apiUrl }}
            - name: OPENFGA_API_URL
              value: {{ .Values.openfga.apiUrl | quote }}
            {{- end }}
            {{- if .Values.openfga.storeId }}
            - name: OPENFGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            {{- end }}
            {{- if .Values.openfga.authzenEnabled }}
            - name: OPENFGA_AUTHZEN_ENABLED
              value: "true"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "gentian-portal.llmDelivered" . }}
            - name: llm-credentials
              mountPath: /var/run/gentian/llm
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "gentian-portal.llmDelivered" . }}
        {{- /* This desktop's own key at the model gateway, from the Secret the
               platform wrote for it. One key of that Secret and no other; a
               file rather than an environment variable, so a key the platform
               replaces is read without a restart; optional, so the desktop
               starts if the Secret is taken away again. */}}
        - name: llm-credentials
          secret:
            secretName: {{ .Values.llm.apiKeySecretName | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ .Values.llm.apiKeySecretKey | default "OPENAI_API_KEY" | quote }}
                path: api-key
        {{- end }}
