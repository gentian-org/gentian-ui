{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gentian-portal.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "gentian-portal.name" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentGatewayName }}
      namespace: {{ .Values.gateway.parentGatewayNamespace }}
      # Bind to the HTTPS listener only.
      #
      # Without a sectionName a route attaches to EVERY listener whose hostname
      # matches, and the kernel Gateway's :80 listener is hostname-less so it
      # matches everything. Gateway API then ranks this route's specific hostname
      # above the redirect route's absent one, so http://portal.<domain> was
      # served in the clear instead of being redirected to https.
      sectionName: {{ .Values.gateway.listenerName | default "https-wildcard" }}
  hostnames:
    - {{ printf "%s.%s" .Values.gateway.host .Values.kernelDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "gentian-portal.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: {{ include "gentian-portal.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: {{ include "gentian-portal.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "gentian-portal.fullname" . }}-web
          port: {{ .Values.web.port }}
{{- end }}
