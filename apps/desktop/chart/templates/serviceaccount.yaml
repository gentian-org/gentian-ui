{{- /* The desktop holds no Kubernetes authority.

     There was a ClusterRole here, and it was large: read and write on
     appprofiles, platformsecuritypolicies, integrationbindings, appgrants,
     backuppolicies, tenantexports and tenantexportschedules, plus create and
     delete on Secrets in any namespace. All of it belonged to the
     administration console this image used to bundle.

     Its own comment admitted the shape of the problem: every call reached the
     API server as this service account, so RBAC authorised THE CONSOLE and
     could not tell a tenant administrator from a platform one -- the tenant
     boundary was enforced in the API layer instead, by hand, in each route.

     The console is its own component now and reaches the director with the
     caller's token, which is checked against OpenFGA before anything happens.
     Nothing in this image calls the Kubernetes API at all, so the role is gone
     and the token is not mounted: not "unused", absent (gentian-os S7A.6). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gentian-portal.fullname" . }}
  labels:
    {{- include "gentian-portal.labels" . | nindent 4 }}
automountServiceAccountToken: false
