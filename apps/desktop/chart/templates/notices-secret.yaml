{{- /*
  The credential of the contract `notices`, which the desktop provides. The
  platform delivers it as a value; it is kept here, in a Secret, and the API
  reads it from there, so that it is in no pod spec. Nothing is rendered
  while no credential was delivered.
*/ -}}
{{- if include "gentian-portal.noticesKey" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gentian-portal.fullname" . }}-notices
  labels:
    {{- include "gentian-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  NOTICES_KEY: {{ include "gentian-portal.noticesKey" . | quote }}
{{- end }}
