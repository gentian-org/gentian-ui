{{- /*
  The concierge: static files and nothing else. It holds no credential,
  talks to no service, and serves only GETs, so it gets no service account
  token and no write access to anything, its own filesystem included.
*/}}
{{- $name := include "concierge.fullname" . }}
{{- $cfg := dict }}
{{- range $k, $v := .Values.config }}
{{- if $v }}{{- $_ := set $cfg $k $v }}{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "concierge.labels" . | nindent 4 }}
data:
  config.json: {{ $cfg | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "concierge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "concierge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concierge.labels" . | nindent 8 }}
      annotations:
        # A changed config.json is a new pod: the file is mounted by subPath,
        # which a running pod never sees updated.
        checksum/config: {{ $cfg | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /sign-in/
              port: http
          livenessProbe:
            httpGet:
              path: /sign-in/
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/site/sign-in/config.json
              subPath: config.json
              readOnly: true
            # The tenants' custom domains, which the operator writes. A
            # directory mount, not subPath, so a domain bound later appears
            # without a restart.
            - name: lookup
              mountPath: /app/site/sign-in/lookup
              readOnly: true
            # The cluster's brand, which the operator renders from the
            # Branding and every page on the cluster loads from here.
            - name: branding
              mountPath: /app/site/branding
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: lookup
          configMap:
            name: {{ .Values.lookupConfigMap }}
            optional: true
        - name: branding
          configMap:
            name: {{ .Values.brandingConfigMap }}
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "concierge.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "concierge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
