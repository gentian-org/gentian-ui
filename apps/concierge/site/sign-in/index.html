<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Gentian</title>
  <link rel="stylesheet" href="/sign-in/sign-in.css">
  <script type="module" src="/sign-in/main.js"></script>
</head>
<body>
  <main class="gentian-login__card">
    <div id="logo" class="gentian-login__logo" role="img" aria-label="Gentian"></div>
    <h1 id="product" class="gentian-login__title">gentian</h1>
    <p class="gentian-login__subtitle">Sign in to your workspace</p>

    <form id="address-form" class="gentian-login__form" novalidate>
      <div>
        <label class="gentian-login__label" for="address">E-mail address</label>
        <input id="address" name="address" class="gentian-login__input" type="email"
               autocomplete="username" autofocus required placeholder="you@example.org">
      </div>
      <button class="gentian-login__btn" type="submit">Continue</button>
      <p id="address-error" class="gentian-login__error" role="alert" hidden></p>
    </form>

    <form id="workspace-form" class="gentian-login__form" novalidate hidden>
      <p class="gentian-login__hint">Which workspace do you sign in to?</p>
      <div>
        <label class="gentian-login__label" for="workspace">Workspace</label>
        <div class="gentian-login__field">
          <input id="workspace" name="workspace" class="gentian-login__input" type="text"
                 autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="acme">
          <span id="suffix" class="gentian-login__suffix"></span>
        </div>
      </div>
      <button class="gentian-login__btn" type="submit">Continue</button>
      <button id="back" class="gentian-login__link" type="button">Use another address</button>
      <p id="workspace-error" class="gentian-login__error" role="alert" hidden></p>
    </form>
  </main>
</body>
</html>
