apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-store.fullname" . }}-api
  labels:
    {{- include "app-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app-store.name" . }}-api
  template:
    metadata:
      labels:
        {{- include "app-store.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "app-store.name" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "app-store.fullname" . }}
      securityContext:
        {{- include "app-store.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            {{- include "app-store.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.api.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- /* The tenant the release is in, as the platform states it: the
                 {t} of the director's routes. */}}
            {{- with .Values.platform.tenant }}
            - name: TENANT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | default "pkce" | quote }}
            {{- /* Token verification. Under edge the forwarded token is
                 verified against the zone's issuer and must carry the
                 director's audience; the platform supplies both. Without an
                 issuer the API verifies nothing, which the backend treats as
                 "auth is not configured" rather than as "everyone is
                 allowed" (see backend/app/core/auth.py). api.env wins when it
                 names the same variable, so a developer can override. */}}
            {{- if and .Values.auth.issuer (not (hasKey (default dict .Values.api.env) "OIDC_ISSUER")) }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            {{- end }}
            {{- if and .Values.auth.clientId (not (hasKey (default dict .Values.api.env) "OIDC_CLIENT_ID")) }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.clientId | quote }}
            {{- end }}
            {{- if and .Values.auth.audience (not (hasKey (default dict .Values.api.env) "OIDC_AUDIENCE")) }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            {{- end }}
            {{- /* The director, for a component that relays the caller's
                 token to it. Left unset, the relay answers 503 and says the
                 director is not configured, rather than guessing a host. */}}
            {{- if and .Values.director.url (not (hasKey (default dict .Values.api.env) "DIRECTOR_URL")) }}
            - name: DIRECTOR_URL
              value: {{ .Values.director.url | quote }}
            {{- end }}
            {{- if and .Values.custodian .Values.custodian.url (not (hasKey (default dict .Values.api.env) "CUSTODIAN_URL")) }}
            - name: CUSTODIAN_URL
              value: {{ .Values.custodian.url | quote }}
            {{- end }}
            {{- if and .Values.usher .Values.usher.url (not (hasKey (default dict .Values.api.env) "USHER_URL")) }}
            - name: USHER_URL
              value: {{ .Values.usher.url | quote }}
            {{- end }}
            {{- if and .Values.director.cluster (not (hasKey (default dict .Values.api.env) "GENTIAN_CLUSTER_ID")) }}
            - name: GENTIAN_CLUSTER_ID
              value: {{ .Values.director.cluster | quote }}
            {{- end }}
            {{- with .Values.platform.kernelDomain }}
            - name: KERNEL_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.platform.realm }}
            - name: KERNEL_REALM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.platform.zoneKind }}
            - name: ZONE_KIND
              value: {{ . | quote }}
            {{- end }}
            {{- /* The store, and this app's own host. Without the first the
                 app says that no App Store is configured; without the second
                 nobody can sign in to one, since the address a store's issuer
                 returns to is spelled from it. */}}
            {{- if and .Values.store .Values.store.url (not (hasKey (default dict .Values.api.env) "STORE_URL")) }}
            - name: STORE_URL
              value: {{ .Values.store.url | quote }}
            {{- end }}
            {{- if and .Values.host (not (hasKey (default dict .Values.api.env) "APP_HOST")) }}
            - name: APP_HOST
              value: {{ .Values.host | quote }}
            {{- end }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- /* The Secret the platform writes for this component, when it
               asked for anything that comes with credentials -- a database, a
               bucket, a cache. A component that asked for none has no such
               Secret and must not name one: envFrom is not optional by
               default, so a missing Secret leaves the pod in
               CreateContainerConfigError, which says nothing about why.
               Leaving existingSecret.name empty is how a component says it
               needs nothing from the platform but the caller's token. */}}
          {{- if .Values.existingSecret.name }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Delays past the server's own start, so its first seconds are not
          # reported as Unhealthy: a probe before the port is bound is a
          # "connection refused" event on every rollout, and the next probe
          # passes.
          livenessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
