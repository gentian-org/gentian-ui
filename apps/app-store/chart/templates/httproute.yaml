{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app-store.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "app-store.name" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentGatewayName }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ required "host is required when gateway.enabled is true" .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "app-store.fullname" . }}-api
          port: 8000
    # The one address a store's issuer redirects to. It is the API's: the
    # sign-in code is exchanged there, by the backend, and never by the bundle.
    - matches:
        - path:
            type: Exact
            value: /oauth/callback
      backendRefs:
        - name: {{ include "app-store.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: {{ include "app-store.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: {{ include "app-store.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "app-store.fullname" . }}-web
          port: {{ .Values.web.port }}
{{- end }}
