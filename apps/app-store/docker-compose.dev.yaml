services:
  api:
    build:
      context: ./backend
    environment:
      AUTH_DISABLED: "true"
      TENANT_ID: demo
      # The Vite proxy rewrites Host to the API's, so the page's origin is
      # named here for the origin check (backend/app/core/origin_check.py).
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      # Name a store to browse one: its API's base address, https.
      # STORE_URL: https://store.example
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_AUTH_DISABLED: "true"
    depends_on:
      - api

volumes:
  web_node_modules:
